server {
    listen 80;
    server_name _;
    client_max_body_size 25M;

    root /usr/share/nginx/html;
    index index.html;

    # FastAPI backend
    location /api/ {
        proxy_pass http://fittwins-backend:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hashed build assets are immutable — cache them aggressively
    location /biological-age/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Biological Age React application
    location /biological-age/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /biological-age/index.html;
    }

    # Main FitTwins coaching website
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
